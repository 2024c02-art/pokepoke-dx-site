name: Regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run regression tests
        run: |
          set -euo pipefail
          for test_file in tests/*.js; do
            echo "Running ${test_file}"
            node "${test_file}"
          done
      - name: Audit card effect parser coverage
        continue-on-error: true
        run: |
          node scripts/audit-card-effect-support.js --json "$RUNNER_TEMP/card-effect-support-audit.json"
      - name: Upload card effect audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-effect-support-audit
          path: ${{ runner.temp }}/card-effect-support-audit.json
          if-no-files-found: warn
