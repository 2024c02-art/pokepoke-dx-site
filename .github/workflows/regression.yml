name: Regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run regression tests
        run: |
          set -euo pipefail
          for test_file in tests/*.js; do
            echo "Running ${test_file}"
            node "${test_file}"
          done
